name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: privpass
          POSTGRES_PASSWORD: privpass
          POSTGRES_DB: privpass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @privpass/backend db:generate
      - run: yarn workspace @privpass/backend typecheck
      - run: yarn workspace @privpass/backend lint
      - name: Run migrations
        run: yarn workspace @privpass/backend db:migrate
        env:
          DATABASE_URL: postgresql://privpass:privpass@localhost:5432/privpass_test
      - name: Run tests
        run: yarn workspace @privpass/backend test
        env:
          DATABASE_URL: postgresql://privpass:privpass@localhost:5432/privpass_test
          JWT_ACCESS_SECRET: ci-test-secret
      - run: yarn workspace @privpass/backend build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @privpass/frontend typecheck
      - run: yarn workspace @privpass/frontend lint
      - run: yarn workspace @privpass/frontend build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile Compact contracts
        # CONTRACTS_SKIP_ZK skips proving-key generation for fast PR feedback
        # (syntax/type-check only). The release/deploy workflow must run a
        # full (non-skip-zk) compile before any Preprod deployment — see
        # docs/deployment.md.
        run: yarn workspace @privpass/contracts compile:ci
      - name: Verify managed artifacts were produced
        run: yarn workspace @privpass/contracts verify-artifacts
      - name: Run contract tests
        run: yarn workspace @privpass/contracts test
