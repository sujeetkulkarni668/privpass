name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: "CL back end push"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: privpass
          POSTGRES_PASSWORD: privpass
          POSTGRES_DB: privpass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Corepack MUST come before setup-node so that setup-node's
      # cache step uses Yarn 4, not the system Yarn 1.x.
      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn workspace @privpass/backend db:generate

      - name: TypeScript type-check
        run: yarn workspace @privpass/backend typecheck

      - name: Lint
        run: yarn workspace @privpass/backend lint
        continue-on-error: true

      - name: Run database migrations
        run: yarn workspace @privpass/backend db:migrate
        env:
          DATABASE_URL: postgresql://privpass:privpass@localhost:5432/privpass_test

      - name: Run tests
        run: yarn workspace @privpass/backend test
        env:
          DATABASE_URL: postgresql://privpass:privpass@localhost:5432/privpass_test
          JWT_ACCESS_SECRET: ci-test-secret-32charmin-padding-x
          WEBHOOK_ENCRYPTION_KEY: 085bc453cede392b913c4c708ec0fa0b7715a6590b15ef4a295e1b36da3ce554085bc453cede392b913c4c708ec0fa0b7715a6590b15ef4a295e1b36da3ce554

      - name: Build
        run: yarn workspace @privpass/backend build

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: "CL front end push"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript type-check
        run: yarn workspace @privpass/frontend typecheck

      - name: Lint
        run: yarn workspace @privpass/frontend lint
        continue-on-error: true

      - name: Build
        run: yarn workspace @privpass/frontend build

  # ── Contracts ─────────────────────────────────────────────────────────────
  contracts:
    name: "CL contracts push"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh || true
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.compact/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          if command -v compact >/dev/null 2>&1; then
            echo "Compact toolchain CLI installed: $(compact --version 2>&1 || true)"
            compact update || true
          fi

      - name: Compile Compact contracts (skip ZK for CI speed)
        run: yarn workspace @privpass/contracts compile:ci

      - name: Verify managed artifacts were produced
        run: yarn workspace @privpass/contracts verify-artifacts

      - name: Run contract tests
        run: yarn workspace @privpass/contracts test
