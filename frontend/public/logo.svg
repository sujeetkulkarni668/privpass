<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="logoCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Icon Container -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Outer Shield -->
    <path d="M28 8 L44 15 C44 31 37 43 28 50 C19 43 12 31 12 15 Z" 
          fill="url(#logoShieldGrad)" 
          opacity="0.15" />
    <path d="M28 8 L44 15 C44 31 37 43 28 50 C19 43 12 31 12 15 Z" 
          stroke="url(#logoShieldGrad)" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#logoGlow)" />

    <!-- Inner Keyhole / Circuit -->
    <path d="M28 17 L38 22 C38 33 33 41 28 45 C23 41 18 33 18 22 Z" 
          fill="#0B1220" 
          stroke="url(#logoCoreGrad)" 
          stroke-width="1.6" />

    <!-- Core Keyhole Node -->
    <circle cx="28" cy="27" r="3.5" fill="#FFFFFF" />
    <path d="M26.5 29 L29.5 29 L30.5 36 L25.5 36 Z" fill="#FFFFFF" />
    <circle cx="28" cy="27" r="1.8" fill="#10B981" />
  </g>

  <!-- Wordmark Text -->
  <text x="74" y="38" font-family="'Fraunces', Georgia, serif" font-size="28" font-weight="700" fill="url(#textGrad)" letter-spacing="-0.5">PrivPass</text>
  
  <!-- ZK Tag Badge -->
  <g transform="translate(200, 18)">
    <rect width="64" height="20" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.35" />
    <text x="32" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="0.5">MIDNIGHT</text>
  </g>
</svg>
