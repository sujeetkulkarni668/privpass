version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: privpass_db
    environment:
      POSTGRES_USER: privpass
      POSTGRES_PASSWORD: privpass_secure_password
      POSTGRES_DB: privpass
    ports:
      - "5432:5432"
    volumes:
      - privpass_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privpass -d privpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: privpass_backend
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://privpass:privpass_secure_password@db:5432/privpass?schema=public"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      MASTER_ENCRYPTION_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: privpass_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  privpass_db_data:
